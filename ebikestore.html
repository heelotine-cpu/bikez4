<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Moto Store</title>
<style>
:root{--bg-main:#060913;--bg-card:#0f1424;--bg-input:#171e32;--border-color:#222d4a;--text-primary:#fff;--text-secondary:#94a3b8;--accent-glow:#00f2ff;--danger:#ef4444;--success:#10b981;}
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}
body{background:var(--bg-main);color:var(--text-primary);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}
.device-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:#060913;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;}
.device-container{background:var(--bg-card);border:1px solid var(--border-color);padding:30px;border-radius:20px;max-width:450px;width:100%;text-align:center;}
.device-btn{background:var(--bg-input);border:1px solid var(--border-color);color:#fff;padding:16px;border-radius:10px;width:100%;font-weight:850;text-transform:uppercase;cursor:pointer;margin-top:10px;}
header{background:rgba(6,9,19,.95);border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);padding:15px 30px;}
.nav-container{max-width:1200px;margin:0 auto;display:flex;justify-content:between;align-items:center;justify-content:space-between;}
#display-brand{font-size:24px;font-weight:900;text-transform:uppercase;font-style:italic;}
.control-btn{background:none;border:1px solid var(--border-color);color:var(--text-secondary);padding:6px 12px;font-size:11px;border-radius:4px;cursor:pointer;}
.cart-trigger{background:var(--bg-card);border:1px solid var(--border-color);color:#fff;padding:10px 20px;border-radius:50px;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:10px;}
#cart-count{background:var(--accent-glow);color:#000;font-size:11px;font-weight:900;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
#admin-panel{background:var(--bg-card);border-bottom:1px solid var(--border-color);padding:25px;display:none;}
.admin-container{max-width:650px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
input,textarea,select{background:var(--bg-input);border:1px solid var(--border-color);color:#fff;padding:12px;border-radius:6px;font-size:14px;width:100%;outline:none;}
.file-upload-wrapper{position:relative;background:var(--bg-input);border:2px dashed var(--border-color);padding:12px;border-radius:6px;text-align:center;cursor:pointer;width:60%;}
.file-upload-wrapper input[type="file"]{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;}
.upload-preview{width:50px;height:40px;object-fit:cover;border-radius:4px;display:none;}
.admin-inventory-list{background:var(--bg-main);border:1px solid var(--border-color);border-radius:8px;max-height:140px;overflow-y:auto;padding:10px;}
.admin-inventory-item{display:flex;justify-content:space-between;align-items:center;padding:6px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;}
.btn-primary{background:var(--accent-glow);color:#000;font-weight:800;border:none;padding:12px 24px;border-radius:6px;cursor:pointer;text-transform:uppercase;font-size:11px;}
.btn-danger-text{background:none;border:none;color:var(--danger);font-size:11px;font-weight:700;cursor:pointer;}
        .hero-banner{text-align:center;padding:50px 20px;max-width:800px;margin:0 auto;}
        .hero-banner h2{font-size:42px;font-weight:900;text-transform:uppercase;font-style:italic;margin-bottom:10px;}
        .hero-banner p{color:var(--text-secondary);font-size:12px;letter-spacing:2px;text-transform:uppercase;}
        main{max-width:1200px;margin:0 auto;padding:0 30px 60px 30px;width:100%;flex-grow:1;}
        .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:30px;}
        body.mobile-mode main{padding:0 15px 40px 15px;}
        body.mobile-mode .product-grid{grid-template-columns:1fr!important;gap:20px;}
        body.mobile-mode .hero-banner h2{font-size:28px;}
        body.mobile-mode header{padding:15px;}
        body.mobile-mode #cart-sidebar{max-width:100%;}
        body.mobile-mode .modal-window{width:95%;padding:20px;}
        .product-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative;}
        .badge-ribbon{position:absolute;top:15px;left:15px;padding:5px 10px;border-radius:4px;font-size:10px;font-weight:900;text-transform:uppercase;z-index:10;}
        .badge-instock{background:var(--success);color:#fff;}
        .badge-soldout{background:var(--danger);color:#fff;}
        .image-wrapper{height:240px;background:#060913;position:relative;cursor:pointer;}
        .image-wrapper img{width:100%;height:100%;object-fit:cover;}
        .card-content{padding:22px;display:flex;flex-direction:column;flex-grow:1;gap:12px;}
        .product-title{font-size:20px;font-weight:900;text-transform:uppercase;font-style:italic;}
        .view-specs-btn{background:none;border:1px solid rgba(255,255,255,.1);color:var(--accent-glow);padding:8px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;width:100%;}
        .purchase-row{display:flex;justify-content:space-between;align-items:center;padding-top:15px;border-top:1px solid rgba(255,255,255,.05);}
        .product-price{font-size:24px;font-weight:900;}
        .buy-btn{background:var(--text-primary);color:#000;font-weight:900;font-size:11px;border:none;padding:12px 20px;border-radius:6px;cursor:pointer;}
        .buy-btn:disabled{background:#1a233a;color:#4b5b80;cursor:not-allowed;}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
        .modal-window{background:var(--bg-card);border:1px solid var(--border-color);width:100%;max-width:550px;border-radius:16px;padding:30px;position:relative;display:flex;flex-direction:column;gap:15px;}
        .close-modal{position:absolute;top:20px;right:20px;background:none;border:none;color:var(--text-secondary);font-size:24px;cursor:pointer;}
        .modal-desc-body{font-size:14px;color:var(--text-secondary);line-height:1.6;white-space:pre-wrap;background:var(--bg-main);padding:15px;border-radius:8px;max-height:240px;overflow-y:auto;}
        #cart-sidebar{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:440px;background:var(--bg-card);border-left:1px solid var(--border-color);z-index:200;transform:translateX(100%);transition:transform .3s ease;padding:25px;display:flex;flex-direction:column;}
        .cart-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-color);padding-bottom:15px;margin-bottom:20px;}
        .close-cart{background:none;border:none;color:var(--text-secondary);font-size:28px;cursor:pointer;}
        #cart-items{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:15px;}
        .cart-item{background:var(--bg-main);border:1px solid var(--border-color);padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;}
        .cart-item-title{font-weight:800;font-size:13px;text-transform:uppercase;font-style:italic;}
        .cart-item-meta{font-size:11px;color:var(--text-secondary);margin-top:2px;}
        .drop-item-btn{background:none;border:none;color:var(--text-secondary);font-size:11px;font-weight:700;cursor:pointer;}
        .checkout-form-container{background:var(--bg-main);border:1px solid var(--border-color);border-radius:12px;padding:15px;display:flex;flex-direction:column;gap:10px;margin-bottom:15px;}
        .cart-footer{border-top:1px solid var(--border-color);padding-top:15px;}
        .total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
        #cart-total{font-size:24px;font-weight:900;color:var(--accent-glow);}
        .empty-label{text-align:center;color:var(--text-secondary);font-size:13px;padding:30px 0;}
    </style>
</head>
<body>
    <div id="device-gateway" class="device-modal"><div class="device-container"><h2>Select Display View</h2><div class="device-buttons"><button onclick="setDeviceMode('phone')" class="device-btn">📱 Mobile View</button><button onclick="setDeviceMode('laptop')" class="device-btn">💻 Laptop View</button></div></div></div>
    <header><div class="nav-container"><div class="brand-group"><span id="display-brand">⚡ LOADING...</span><button onclick="toggleAdmin()" class="control-btn">⚙️ Menu</button></div><button onclick="toggleCart()" class="cart-trigger"><span>CART</span><span id="cart-count">0</span></button></div></header>
    <div id="admin-panel"><div class="admin-container"><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-color);padding-bottom:8px;"><h3 style="font-size:11px;text-transform:uppercase;color:var(--accent-glow);">⚙️ Settings</h3><span style="font-size:10px;color:#4b5b80;font-family:monospace;">V6.0.0</span></div>
    <div id="admin-auth" class="input-row"><input type="password" id="owner-code-input" placeholder="ENTER PIN"><button onclick="checkOwnerCode()" class="btn-primary">Unlock</button></div>
    <div id="admin-form" style="display:none;flex-direction:column;gap:15px;"><div style="background:var(--bg-main);padding:15px;border-radius:8px;border:1px solid var(--border-color);"><div class="input-row"><input type="text" id="store-name-input" placeholder="Branding Name"><button onclick="updateStoreSettings()" class="btn-primary" style="background:#fff;color:#000;">Save</button></div></div>
    <div class="input-row"><input type="text" id="p-title" placeholder="Model Name"><input type="number" id="p-price" placeholder="Price ($)"></div>
    <div class="input-row"><select id="p-status" style="width:40%;"><option value="instock">In Stock</option><option value="soldout">Sold Out</option></select><div class="file-upload-wrapper"><span id="upload-label-text">📷 Upload Photo</span><input type="file" id="p-file" accept="image/*" onchange="previewFileImage(this)"></div><img id="p-file-preview" class="upload-preview"></div>
    <textarea id="p-desc" placeholder="Specifications..."></textarea><button onclick="saveProduct()" class="btn-primary" style="width:100%;">Publish</button>
    <div id="admin-inventory-list" class="admin-inventory-list"></div><div style="text-align:right;"><button onclick="clearInventory()" class="btn-danger-text">Wipe Storage</button></div></div></div></div>
    <section class="hero-banner"><h2 id="hero-title-branding">MOTO SHOWROOM</h2><p>Zero Emissions. Instant Torque. Built to Send.</p></section>
    <main><div id="product-grid" class="product-grid"></div></main>
    <div id="cart-sidebar"><div class="cart-header"><h3>ORDER SPEC SHEET</h3><button onclick="toggleCart()" class="close-cart">&times;</button></div><div id="cart-items"></div>
    <div id="checkout-form-area" class="checkout-form-container" style="display:none;"><input type="text" id="cust-name" placeholder="Full Name"><input type="text" id="cust-address" placeholder="Shipping Address"><input type="text" id="cust-phone" placeholder="Phone Number"><select id="cust-email-provider"><option value="gmail">Gmail App</option><option value="outlook">Outlook App</option></select></div>
    <div class="cart-footer"><div class="total-row"><span>TOTAL COST:</span><span id="cart-total">$0.00</span></div><button onclick="processEmailOrder()" id="checkout-order-btn" class="btn-primary" style="width:100%;padding:15px;">Submit Order Via Email</button></div></div>
    <div id="spec-modal" class="modal-overlay"><div class="modal-window"><button onclick="closeSpecModal()" class="close-modal">&times;</button><h3 id="modal-bike-title" class="product-title">METRICS</h3><div id="modal-bike-desc" class="modal-desc-body"></div></div></div>
    <footer style="margin-top:auto;padding:30px;text-align:center;border-top:1px solid var(--border-color);background:rgba(6,9,19,.5);"><p style="font-size:11px;color:var(--text-secondary);">© 2026 <span id="footer-brand-name">RONSTER RIDES</span>. COLLABORATIVE AI ARCHITECTURE.</p></footer>
<script>
const OWNER_CODE="1234";let storeName=localStorage.getItem('store_brand_name')||"RONSTER RIDES";
let products=JSON.parse(localStorage.getItem('store_inventory'))||[{id:1,title:"2025 SURRON LIGHT BEE X",price:6490,status:"instock",desc:"The Ultimate All-Terrain Electric Weapon.\n\n• Powertrain: 60V Battery Pack\n• Peak Output: 6,000 Watts\n• Top Speed: 47 MPH\n• Max Range: 45 Miles\n• Frame: Forged Aluminum\n• Braking: Hydraulic Disc Brake System",img:"https://unsplash.com"}];
let cart=[],encodedImageString="";function setDeviceMode(m){if(m==='phone')document.body.classList.add('mobile-mode');else document.body.classList.remove('mobile-mode');document.getElementById('device-gateway').style.display='none';}
function refreshBranding(){document.getElementById('display-brand').innerText=`⚡ ${storeName}`;document.getElementById('hero-title-branding').innerText=`${storeName} MOTOS`;document.getElementById('store-name-input').value=storeName;let f=document.getElementById('footer-brand-name');if(f)f.innerText=storeName;}
function toggleAdmin(){let p=document.getElementById('admin-panel');p.style.display=(p.style.display==='block')?'none':'block';}
function checkOwnerCode(){if(document.getElementById('owner-code-input').value===OWNER_CODE){document.getElementById('admin-auth').style.display='none';document.getElementById('admin-form').style.display='flex';}else{alert("REJECTED");}}
function updateStoreSettings(){let n=document.getElementById('store-name-input').value.trim();if(n){storeName=n.toUpperCase();localStorage.setItem('store_brand_name',storeName);}refreshBranding();alert("Saved");}
function previewFileImage(i){const f=i.files[0];if(!f)return;document.getElementById('upload-label-text').innerText="⏳ Processing...";const r=new FileReader();r.onload=function(e){const img=new Image();img.onload=function(){const canvas=document.createElement('canvas');let w=img.width,h=img.height,max=800;if(w>max||h>max){if(w>h){h*=max/w;w=max;}else{w*=max/h;h=max;}}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);encodedImageString=canvas.toDataURL('image/jpeg',.7);const p=document.getElementById('p-file-preview');p.src=encodedImageString;p.style.display="block";document.getElementById('upload-label-text').innerText="✓ Ready";};img.src=e.target.result;};r.readAsDataURL(f);}
function saveProduct(){let t=document.getElementById('p-title').value.trim().toUpperCase(),p=parseFloat(document.getElementById('p-price').value),d=document.getElementById('p-desc').value.trim(),s=document.getElementById('p-status').value;if(!t||isNaN(p)){alert("Missing fields");return;}products.push({id:Date.now(),title:t,price:p,status:s,desc:d,img:encodedImageString||"https://unsplash.com"});localStorage.setItem('store_inventory',JSON.stringify(products));document.getElementById('p-title').value='';document.getElementById('p-price').value='';document.getElementById('p-desc').value='';document.getElementById('p-file-preview').style.display='none';document.getElementById('upload-label-text').innerText="📷 Upload Photo";encodedImageString="";renderProducts();renderAdminInventory();alert("Added");}
function clearInventory(){if(confirm("Wipe logs?")){products=[];localStorage.removeItem('store_inventory');renderProducts();renderAdminInventory();updateCart();}}
function deleteItem(id){products=products.filter(p=>p.id!==id);localStorage.setItem('store_inventory',JSON.stringify(products));renderProducts();renderAdminInventory();}
function renderAdminInventory(){let l=document.getElementById('admin-inventory-list');l.innerHTML=products.length===0?'<p style="color:var(--text-secondary);font-size:12px;padding:10px;">Empty</p>':'';products.forEach(p=>{l.innerHTML+=`<div class="admin-inventory-item"><span><strong>${p.title}</strong> - $${p.price}</span><button onclick="deleteItem(${p.id})" class="btn-primary" style="padding:4px 8px;font-size:10px;background:var(--danger);color:#fff;">Delete</button></div>`;});}
function openSpecModal(id){let p=products.find(prod=>prod.id===id);if(!p)return;document.getElementById('modal-bike-title').innerText=p.title;document.getElementById('modal-bike-desc').innerText=p.desc||"No specs.";document.getElementById('spec-modal').style.display="flex";}
function closeSpecModal(){document.getElementById('spec-modal').style.display="none";}
function renderProducts(){let g=document.getElementById('product-grid');if(products.length===0){g.innerHTML='<div class="empty-label" style="grid-column:1/-1;">Showroom Display Empty.</div>';return;}g.innerHTML='';products.forEach(p=>{let c=p.status==='instock'?'badge-instock':'badge-soldout',t=p.status==='instock'?'In Stock':'Sold Out',d=p.status==='soldout'?'disabled':'';g.innerHTML+=`<div class="product-card"><div class="badge-ribbon ${c}">${t}</div><div class="image-wrapper" onclick="openSpecModal(${p.id})"><img src="${p.img}"></div><div class="card-content"><h4 class="product-title" onclick="openSpecModal(${p.id})" style="cursor:pointer;">${p.title}</h4><button onclick="openSpecModal(${p.id})" class="view-specs-btn">Specifications</button><div class="purchase-row"><span class="product-price">$${p.price.toLocaleString()}</span><button onclick="addToCart('${p.title.replace(/'/g,"\\'")}',${p.price})" class="buy-btn" ${d}>Order</button></div></div></div>`;});}
function toggleCart(){let s=document.getElementById('cart-sidebar');s.style.transform=(s.style.transform==='translateX(0%)')?'translateX(100%)':'translateX(0%)';}
function addToCart(n,p){let item=cart.find(i=>i.name===n);if(item)item.quantity+=1;else cart.push({name:n,price:p,quantity:1});updateCart();document.getElementById('cart-sidebar').style.transform='translateX(0%)';}
function removeFromCart(n){cart=cart.filter(i=>i.name!==n);updateCart();}
function updateCart(){let d=document.getElementById('cart-items'),t=document.getElementById('cart-total'),c=document.getElementById('cart-count'),b=document.getElementById('checkout-order-btn'),f=document.getElementById('checkout-form-area');if(cart.length===0){d.innerHTML='<p class="empty-label">0 Builds Active.</p>';c.innerText='0';t.innerText='$0.00';b.style.display='none';f.style.display='none';return;}d.innerHTML='';let tot=0,cnt=0;cart.forEach(i=>{tot+=i.price*i.quantity;cnt+=i.quantity;d.innerHTML+=`<div class="cart-item"><div><p class="cart-item-title">${i.name}</p><p class="cart-item-meta">$${i.price} x ${i.quantity}</p></div><button onclick="removeFromCart('${i.name.replace(/'/g,"\\'")}')" class="drop-item-btn" style="background:none;border:none;color:var(--text-secondary);font-size:11px;cursor:pointer;">Drop</button></div>`;});c.innerText=cnt;t.innerText=`$${tot.toFixed(2)}`;b.style.display='block';f.style.display='flex';}
function processEmailOrder(){let n=document.getElementById('cust-name').value.trim(),a=document.getElementById('cust-address').value.trim(),p=document.getElementById('cust-phone').value.trim(),pv=document.getElementById('cust-email-provider').value;if(!n||!a||!p){alert("Fill fields");return;}let target=(pv==="gmail")?"heelotine@gmail.com":"nike_boss01@outlook.com";let b=`NEW MOTO ORDER\n==================\nNAME: ${n}\nPHONE: ${p}\nADDRESS: ${address=a}\n\nITEMS:\n`;cart.forEach(i=>{b+=`• ${i.name} (Qty: ${i.quantity}) - $${i.price*i.quantity}\n`;});b+=`\nTOTAL: ${document.getElementById('cart-total').innerText}`;window.location.href=`mailto:${target}?subject=New Order - ${n}&body=${encodeURIComponent(b)}`;cart=[];updateCart();toggleCart();}
window.onURIChange=refreshBranding();
</script></body></html>

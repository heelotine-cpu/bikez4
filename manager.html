<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltRide | Core Inventory Exporter</title>
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: #0f1424;
            --bg-input: #171e32;
            --border-color: #222d4a;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-glow: #00f2ff;
            --danger: #ef4444;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-main); color: var(--text-primary); min-height: 100vh; padding: 30px 15px; display: flex; flex-direction: column; align-items: center; }
        .wrapper { max-width: 650px; width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        h2 { font-size: 20px; text-transform: uppercase; font-style: italic; color: var(--accent-glow); margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        input, textarea, select { background: var(--bg-input); border: 1px solid var(--border-color); color: #fff; padding: 14px; border-radius: 8px; font-size: 14px; width: 100%; outline: none; }
        input:focus, textarea:focus, select:focus { border-color: var(--accent-glow); }
        .row { display: flex; gap: 12px; }
        .file-wrapper { position: relative; background: var(--bg-input); border: 2px dashed var(--border-color); padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; width: 100%; }
        .file-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .btn { background: var(--accent-glow); color: #000; font-weight: 800; border: none; padding: 14px 24px; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 12px; width: 100%; letter-spacing: 0.5px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .export-box { background: var(--bg-main); border: 1px solid var(--border-color); padding: 20px; border-radius: 10px; margin-top: 25px; display: none; flex-direction: column; gap: 15px; }
        .export-box p { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
        textarea.code-output { font-family: monospace; font-size: 11px; height: 120px; color: var(--success); background: #02040a; border-color: #161b22; resize: none; }
    </style>
</head>
<body>

    <div class="wrapper">
        <h2>📦 Showroom Inventory Exporter</h2>
        
        <div class="form-group">
            <div class="row">
                <input type="text" id="bike-title" placeholder="Bike Model Name (e.g., TALARIA STING R)">
                <input type="number" id="bike-price" placeholder="Price ($)">
            </div>
            
            <div class="row" style="align-items: center;">
                <select id="bike-status" style="width: 40%;">
                    <option value="instock">In Stock</option>
                    <option value="soldout">Sold Out</option>
                </select>
                <div class="file-wrapper">
                    <span id="upload-status-text">📷 Select Image File</span>
                    <input type="file" id="bike-file" accept="image/*" onchange="compressAndEncodeImage(this)">
                </div>
            </div>
            
            <textarea id="bike-desc" style="height: 120px;" placeholder="Enter specifications, range, and battery capabilities..."></textarea>
            
            <button onclick="addBikeToTemporaryManifest()" class="btn">Add Bike Variant to Manifest</button>
        </div>

        <div id="export-container" class="export-box">
            <p><strong>✓ Manifest Array Ready!</strong> Copy the entire line of code inside the green text window below, then paste it directly into your main index page script variable container inside GitHub.</p>
            <textarea id="manifest-output" class="code-output" readonly onclick="this.select()"></textarea>
            <button onclick="copyManifestCodeToClipboard()" class="btn" style="background: #fff; color: #000;">Copy Code to Clipboard</button>
        </div>
    </div>

    <script>
        let transientInventoryItems = [];
        let encodedBase64Image = "";

        function compressAndEncodeImage(inputElement) {
            const uploadedFiles = inputElement.files;
            if (!uploadedFiles || uploadedFiles.length === 0) return;
            
            document.getElementById('upload-status-text').innerText = "⏳ Processing Asset...";
            
            const fileReader = new FileReader();
            fileReader.onload = function(event) {
                const targetImage = new Image();
                targetImage.onload = function() {
                    const canvasElement = document.createElement('canvas');
                    let targetWidth = targetImage.width;
                    let targetHeight = targetImage.height;
                    const maxBoundaryDimension = 800;
                    
                    if (targetWidth > maxBoundaryDimension || targetHeight > maxBoundaryDimension) {
                        if (targetWidth > targetHeight) {
                            targetHeight *= maxBoundaryDimension / targetWidth;
                            targetWidth = maxBoundaryDimension;
                        } else {
                            targetWidth *= maxBoundaryDimension / targetHeight;
                            targetHeight = maxBoundaryDimension;
                        }
                    }
                    
                    canvasElement.width = targetWidth;
                    canvasElement.height = targetHeight;
                    canvasElement.getContext('2d').drawImage(targetImage, 0, 0, targetWidth, targetHeight);
                    
                    encodedBase64Image = canvasElement.toDataURL('image/jpeg', 0.65);
                    document.getElementById('upload-status-text').innerText = "✓ Asset Loaded Successfully";
                };
                targetImage.src = event.target.result;
            };
            fileReader.readAsDataURL(uploadedFiles[0]);
        }

        function addBikeToTemporaryManifest() {
            const inputTitle = document.getElementById('bike-title').value.trim().toUpperCase();
            const inputPrice = parseFloat(document.getElementById('bike-price').value);
            const inputDesc = document.getElementById('bike-desc').value.trim();
            const inputStatus = document.getElementById('bike-status').value;
            
            if (!inputTitle || isNaN(inputPrice)) {
                alert("Error: Please provide at least a Model Title and a numeric Price value.");
                return;
            }
            
            const localFallbackPlaceholder = "https://unsplash.com";
            
            const freshBikeRecordObject = {
                id: Date.now(),
                title: inputTitle,
                price: inputPrice,
                status: inputStatus,
                desc: inputDesc || "No configuration metrics documentation loaded.",
                img: encodedBase64Image || localFallbackPlaceholder
            };
            
            transientInventoryItems.push(freshBikeRecordObject);
            
            // Generate Code String Block
            const printedCodeStringText = JSON.stringify(transientInventoryItems);
            document.getElementById('manifest-output').value = printedCodeStringText;
            document.getElementById('export-container').style.display = "flex";
            
            // Reset entry elements fields
            document.getElementById('bike-title').value = '';
            document.getElementById('bike-price').value = '';
            document.getElementById('bike-desc').value = '';
            document.getElementById('bike-file').value = '';
            document.getElementById('upload-status-text').innerText = "📷 Select Image File";
            encodedBase64Image = "";
            
            alert(`"${inputTitle}" successfully added to the dynamic batch template manifest list!`);
        }

        function copyManifestCodeToClipboard() {
            const outputTextArea = document.getElementById('manifest-output');
            outputTextArea.select();
            document.execCommand('copy');
            alert("Manifest code copied directly to your dashboard clipboard frame registry!");
        }
    </script>
</body>
</html>
